name: Publish Arena evidence

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "config/**"
      - "docs/submissions/**"
      - "docs/p0-release-status.md"
      - "skills/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate curated evidence
        run: python3 scripts/build_arena_bundle.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy evidence only
        id: deployment
        uses: actions/deploy-pages@v4
