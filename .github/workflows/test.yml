name: Verify gateway
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m pip install pytest
      - run: python3 -m pytest scripts -q
      - run: python3 scripts/run_demo_tests.py
      - run: python3 scripts/run_pharos_demo_tests.py
      - run: python3 scripts/build_arena_bundle.py
